embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

vectordb:
  provider: chroma
  persist_directory: data/processed/chroma

chunking:
  chunk_size: 500
  chunk_overlap: 50

retrieval:
  top_k: 5
  candidate_k: 20
  reranker: hybrid_keyword_semantic_cross_encoder
  cross_encoder:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2

llm:
  provider: anthropic
  model: claude-sonnet-5
