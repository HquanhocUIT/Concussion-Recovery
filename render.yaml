databases:
  - name: reentry-db
    plan: free
    databaseName: reentry
    user: reentry

services:
  - type: web
    name: reentry-rag
    runtime: docker
    dockerfilePath: ./rag/Dockerfile
    dockerContext: ./rag
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CHROMA_PERSIST_DIR
        value: ./data/processed/chroma
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: reentry-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reentry-db
          property: connectionString
      - key: RAG_SERVICE_URL
        fromService:
          type: web
          name: reentry-rag
          property: host
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

  - type: web
    name: reentry-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: reentry-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
