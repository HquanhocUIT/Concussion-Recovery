databases:
  - name: reentry-db
    plan: free
    databaseName: reentry
    user: reentry

services:
  - type: web
    name: reentry-rag
    runtime: docker
    dockerfilePath: ./rag/Dockerfile
    dockerContext: ./rag
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CHROMA_PERSIST_DIR
        value: ./data/processed/chroma
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: reentry-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reentry-db
          property: connectionString
      # httpx needs a scheme; `property: host` yields a bare hostname.
      - key: RAG_SERVICE_URL
        value: https://reentry-rag.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

  - type: web
    name: reentry-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Vite inlines this at build time, so it must be a full origin.
      # `property: host` yields the bare hostname ("reentry-backend"), which
      # the browser resolves as a relative path against the frontend origin.
      - key: VITE_API_BASE_URL
        value: https://reentry-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
